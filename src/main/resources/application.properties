# ------------------------------------------------------------------
# Aplicacao
# ------------------------------------------------------------------
spring.application.name=sansuy-pedidos

# ------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# Estes valores batem com o docker-compose da Fase 2. Para rodar antes
# disso, suba um Postgres descartavel (veja o README).
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/sansuy
spring.datasource.username=sansuy
spring.datasource.password=sansuy
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
# Estudo: em producao usariamos migracoes (Flyway/Liquibase). Aqui
# "update" cria/atualiza o schema a partir das entidades por simplicidade.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# open-in-view=false DE PROPOSITO: fecha a sessao JPA ao sair do service,
# forcando o mapeamento Entidade->DTO a acontecer DENTRO da transacao.
# E o que torna o LazyInitializationException reproduzivel na Fase 4.
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# Log de SQL — desligado por padrao. Na FASE 4 ligamos para observar
# N+1 e contagem de queries.
# ------------------------------------------------------------------
spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
